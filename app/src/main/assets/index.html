let rankCache={},rankRequest=0,rankLoading='';
function syncRankingSources(){let sources=window.rankingSources.filter(s=>s&&typeof s.name==='string'&&typeof s.run==='function'),old=rankSelect.value;rankSelect.replaceChildren();sources.forEach(s=>{let o=document.createElement('option');o.value=s.name;o.textContent=s.name;rankSelect.appendChild(o)});let saved='';try{saved=localStorage.getItem('hengdu-ranking-source')||''}catch(e){}if(sources.some(s=>s.name===old))rankSelect.value=old;else if(sources.some(s=>s.name===saved))rankSelect.value=saved;rankSelect.disabled=!sources.length;rankRefresh.disabled=!sources.length;return sources}
function renderRankings(items){rankGrid.replaceChildren();items.forEach((book,i)=>{let b=document.createElement('button');b.type='button';b.className='ranking-card';let wrap=document.createElement('div');wrap.className='ranking-cover';wrap.appendChild(buildCover(book));let number=document.createElement('span');number.className='ranking-number';number.textContent=String(book.rank||i+1);wrap.appendChild(number);b.appendChild(wrap);let title=document.createElement('strong');title.className='ranking-title';title.textContent=book.title;b.appendChild(title);let sub=document.createElement('small');sub.className='ranking-source';sub.textContent=book.source||'';b.appendChild(sub);b.onclick=()=>showBook(book,'rankings');rankGrid.appendChild(b)})}
async function loadRankings(force){let sources=syncRankingSources(),name=rankSelect.value,provider=sources.find(s=>s.name===name);if(!provider){rankRequest++;rankGrid.replaceChildren();rankStatus.textContent='目前沒有可用的排行榜。';return}if(!force&&rankCache[name]){renderRankings(rankCache[name]);rankStatus.textContent='共 '+rankCache[name].length+' 部作品';return}if(!force&&rankLoading===name)return;let request=++rankRequest;rankLoading=name;rankGrid.replaceChildren();rankStatus.textContent='正在載入「'+name+'」排行榜…';rankRefresh.disabled=true;try{let data=await provider.run();if(request!==rankRequest||rankSelect.value!==name)return;let items=Array.isArray(data&&data.results)?data.results.filter(x=>x&&typeof x.title==='string'&&typeof x.url==='string'):[];rankCache[name]=items;renderRankings(items);rankStatus.textContent=items.length?'共 '+items.length+' 部作品':'目前沒有排行榜作品。'}catch(e){if(request!==rankRequest||rankSelect.value!==name)return;rankStatus.textContent=(e&&e.message?e.message:'排行榜載入失敗，請稍後再試。')}finally{if(request===rankRequest){rankLoading='';rankRefresh.disabled=false}}}
function openRankings(){loadRankings(false)}
rankSelect.onchange=()=>{try{localStorage.setItem('hengdu-ranking-source',rankSelect.value)}catch(e){}loadRankings(true)};
rankRefresh.onclick=()=>loadRankings(true);
window.readerBack=function(){if($('#cancelRemoval')){$('#cancelRemoval').click();return}if($('#reader').classList.contains('active')){$('#back').click();return}if(!$('#bookView').hidden){if(selectionMode){$('#selectionCancel').click();return}$('#bookBack').click();return}selectTab('library')};
installSortControls();displayView('library');renderLibrary();

</script></body></html>
